spring.application.name=backend

server.port=8080

spring.datasource.url=jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=PhonebookDB_TestRestore;encrypt=true;trustServerCertificate=true;integratedSecurity=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JWT configuration
jwt.issuer=PhonebookApplication
jwt.audience=PhonebookVueClient
jwt.key=${PHONEBOOK_JWT_KEY}

# Initial user provisioning
initial-user.username=${INITIAL_USER_USERNAME:}
initial-user.password=${INITIAL_USER_PASSWORD:}